{% load icon_tags %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{ theme_color }}">
<title>Offline - PQ Platform</title>
<link rel="icon" type="image/png" sizes="32x32" href="/brand/favicon-32.png">
<style>
{% include "core/css/_tokens.css" %}
*{box-sizing:border-box;margin:0;}
body{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--text);
  font-family:system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:1.5;}
main{max-width:360px;text-align:center;}
.mark{width:56px;height:56px;color:var(--accent);margin-bottom:20px;}
h1{font-size:20px;font-weight:600;margin-bottom:8px;}
p{color:var(--muted);margin-bottom:22px;}
button{font:inherit;font-weight:500;padding:10px 18px;min-height:44px;border:1px solid var(--primary);border-radius:8px;background:var(--primary);color:var(--on-accent);cursor:pointer;}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<main>
  {% brand_mark 'mark' %}
  <h1>You are offline</h1>
  <p>PQ Platform needs a connection to load your data. Check your network, then try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
<script>
  window.addEventListener('online', function () { location.reload(); });
</script>
</body>
</html>
