{# Sidebar entry: a green dot and a count, opening a popover with the list. #}
<div class="side-presence" x-data="{ open: false, pos: '' }" @keydown.escape.window="open = false" @click.outside="open = false">
  <button type="button" class="side-item" aria-haspopup="true" :aria-expanded="open.toString()"
          data-label="Online now"
          @click="
            const r = $el.getBoundingClientRect();
            pos = window.innerWidth > 860 ? `left:${r.right + 8}px;bottom:${window.innerHeight - r.bottom}px;` : '';
            open = !open">
    <span class="presence-dot" :class="($store.presence.mode === 'live' || $store.presence.mode === 'polling') ? 'is-live' : 'is-off'" aria-hidden="true"></span>
    <span class="side-label">Online now</span>
    <span class="side-badge" x-text="$store.presence.online.length">0</span>
  </button>
  <div class="presence-pop" x-show="open" x-transition.opacity.duration.100ms :style="pos" style="display:none;">
    {% include "core/_presence_panel.html" %}
  </div>
</div>
