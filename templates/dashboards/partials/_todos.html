<form hx-post="{% url 'dashboards:todos' %}" hx-target="#todo-list" hx-swap="innerHTML" hx-on::after-request="this.reset()" style="display:flex;gap:8px;margin-bottom:8px;">
  {% csrf_token %}
  <input type="text" name="text" maxlength="300" placeholder="Add something you want to do…" required autocomplete="off" style="flex:1;min-width:0;">
  <button class="btn btn-primary" type="submit">Add</button>
</form>
{% for t in todos %}
<div class="dash-row">
  <button class="dash-act" hx-post="{% url 'dashboards:todo_toggle' pk=t.pk %}" hx-target="#todo-list" hx-swap="innerHTML" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' aria-label="{% if t.done %}Mark not done{% else %}Mark done{% endif %}">{% if t.done %}☑{% else %}☐{% endif %}</button>
  <span class="lead" style="white-space:normal;{% if t.done %}text-decoration:line-through;color:var(--muted);{% endif %}">{{ t.text }}</span>
  <button class="dash-act" hx-post="{% url 'dashboards:todo_delete' pk=t.pk %}" hx-target="#todo-list" hx-swap="innerHTML" hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' aria-label="Delete">✕</button>
</div>
{% empty %}
<p class="empty-line">Nothing on your list yet.</p>
{% endfor %}
