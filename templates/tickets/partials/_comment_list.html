{% for comment in comments %}
<div style="padding-bottom:12px;{% if not forloop.last %}border-bottom:1px solid var(--line);margin-bottom:12px;{% endif %}">
  <div class="flex-between">
    <span class="text-sm font-medium">
      {% if comment.author %}
      <span class="avatar" style="width:18px;height:18px;font-size:9px;">{{ comment.author.username.0|upper }}</span>
      {{ comment.author.get_full_name|default:comment.author.username }}
      {% else %}System{% endif %}
    </span>
    <span class="date">{{ comment.created_at|timesince }} ago</span>
  </div>
  <div class="text-sm" style="margin-top:6px;white-space:pre-wrap;">{{ comment.body }}</div>
</div>
{% empty %}
<p class="text-sm text-muted">No comments yet.</p>
{% endfor %}
