<form method="post" action="{% url 'tickets:ticket_assign' pk=ticket.pk %}"
      hx-post="{% url 'tickets:ticket_assign' pk=ticket.pk %}"
      hx-target="#detail-assignee"
      hx-swap="innerHTML"
      >
  {% csrf_token %}
  {% with assignees_qs=members selected_ids=assignee_selected_ids auto_submit=True %}
  {% include "tickets/partials/_assignee_multiselect.html" %}
  {% endwith %}
</form>
{% if ticket.former_assignees and not ticket.assignees.all %}<span class="pill" title="Removed from the team" style="margin-top:var(--space-1);">Was {{ ticket.former_assignees }}</span>{% endif %}
