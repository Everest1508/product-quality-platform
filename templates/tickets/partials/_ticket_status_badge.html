<span class="inline-flex items-center px-2 py-0.5 rounded text-[10px] font-semibold uppercase
    {% if ticket.status == 'open' %}bg-gray-100 text-gray-700
    {% elif ticket.status == 'assigned' %}bg-blue-100 text-blue-700
    {% elif ticket.status == 'in_progress' %}bg-yellow-100 text-yellow-700
    {% elif ticket.status == 'testing' %}bg-purple-100 text-purple-700
    {% elif ticket.status == 'resolved' %}bg-green-100 text-green-700
    {% elif ticket.status == 'closed' %}bg-gray-200 text-gray-500
    {% endif %}">
    {{ ticket.get_status_display }}
</span>
