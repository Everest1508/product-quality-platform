<script>
(function() {
  const board = document.getElementById('kanban-board');
  if (!board || board.dataset.dragBound) return;
  board.dataset.dragBound = '1';
  let draggedCard = null;

  function recount() {
    document.querySelectorAll('.kanban-col').forEach(function(c) {
      const cards = c.querySelector('.kanban-cards');
      const n = cards.querySelectorAll('.kanban-card').length;
      const more = Number(cards.dataset.more || 0);
      c.querySelector('.kanban-count').textContent = n + more;
      if (n === 0 && more === 0 && !cards.querySelector('.kanban-empty')) {
        const e = document.createElement('div');
        e.className = 'kanban-empty';
        e.textContent = 'No tickets';
        cards.appendChild(e);
      }
    });
  }

  board.addEventListener('dragstart', function(e) {
    const card = e.target.closest('.kanban-card');
    if (!card) return;
    draggedCard = card;
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', card.dataset.ticketId);
  });

  board.addEventListener('dragend', function(e) {
    const card = e.target.closest('.kanban-card');
    if (card) card.classList.remove('dragging');
    document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
    draggedCard = null;
  });

  board.addEventListener('dragover', function(e) {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    const col = e.target.closest('.kanban-col');
    if (col) {
      document.querySelectorAll('.kanban-col').forEach(c => c.classList.remove('drag-over'));
      col.classList.add('drag-over');
    }
  });

  board.addEventListener('dragleave', function(e) {
    const col = e.target.closest('.kanban-col');
    if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
  });

  function moveCard(card, newStatus) {
    const oldStatus = card.dataset.status;
    if (newStatus === oldStatus) return;
    const oldCol = document.querySelector('.kanban-col[data-status="' + oldStatus + '"] .kanban-cards');
    const target = document.querySelector('.kanban-col[data-status="' + newStatus + '"] .kanban-cards');
    if (!target) return;
    const empty = target.querySelector('.kanban-empty');
    if (empty) empty.remove();
    target.appendChild(card);
    card.dataset.status = newStatus;
    recount();
    fetch(card.dataset.url, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
        'X-CSRFToken': card.dataset.csrf,
        'X-Requested-With': 'XMLHttpRequest',
      },
      body: 'status=' + encodeURIComponent(newStatus),
    }).then(function(resp) {
      if (!resp.ok) {
        resp.json().then(function(data) {
          window.dispatchEvent(new CustomEvent('django-message', { detail: { text: data.error || 'Cannot move ticket', tags: 'error' } }));
        });
        if (oldCol) { oldCol.appendChild(card); card.dataset.status = oldStatus; recount(); }
      } else {
        resp.json().then(function(data) {
          if (data.message) window.pqToast(data.message, 'success');
          if (data.warning) window.pqToast(data.warning, 'warning');
          if (data.status === 'resolved' || data.status === 'closed') window.pqConfetti();
        });
      }
    });
  }

  board.addEventListener('drop', function(e) {
    e.preventDefault();
    const col = e.target.closest('.kanban-col');
    col && col.classList.remove('drag-over');
    if (!col || !draggedCard) return;
    moveCard(draggedCard, col.dataset.status);
  });

  // "Move to" icon on each card: one shared menu, positioned under the clicked button.
  const menu = document.createElement('div');
  menu.className = 'kanban-move-menu';
  menu.hidden = true;
  document.body.appendChild(menu);
  let menuCard = null;
  function closeMenu() { menu.hidden = true; menuCard = null; }
  board.addEventListener('click', function(e) {
    const btn = e.target.closest('.kanban-move-btn');
    if (!btn) return;
    e.stopPropagation();
    const card = btn.closest('.kanban-card');
    if (menuCard === card) return closeMenu();
    menuCard = card;
    menu.innerHTML = '';
    document.querySelectorAll('.kanban-col').forEach(function(c) {
      const o = document.createElement('button');
      o.type = 'button';
      o.className = 'kanban-move-item' + (c.dataset.status === card.dataset.status ? ' is-current' : '');
      o.innerHTML = '<span class="dot ' + c.dataset.status + '"></span>';
      o.append(c.querySelector('.kanban-header span').textContent.trim());
      o.onclick = function() { closeMenu(); moveCard(card, c.dataset.status); };
      menu.appendChild(o);
    });
    menu.hidden = false;
    const r = btn.getBoundingClientRect();
    menu.style.top = Math.min(r.bottom + 4, window.innerHeight - menu.offsetHeight - 8) + 'px';
    menu.style.left = Math.max(8, Math.min(r.right - menu.offsetWidth, window.innerWidth - menu.offsetWidth - 8)) + 'px';
  });
  document.addEventListener('click', closeMenu);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeMenu(); });
  window.addEventListener('scroll', closeMenu, true);

  // Touch fallback: long-press a card to pick a target column.
  board.addEventListener('contextmenu', function(e) {
    const card = e.target.closest('.kanban-card');
    if (!card || !('ontouchstart' in window)) return;
    e.preventDefault();
    moveViaPrompt(card);
  });
  let pressTimer = null;
  board.addEventListener('touchstart', function(e) {
    const card = e.target.closest('.kanban-card');
    if (!card) return;
    pressTimer = setTimeout(function() { moveViaPrompt(card); }, 550);
  }, { passive: true });
  board.addEventListener('touchend', function() { clearTimeout(pressTimer); });
  board.addEventListener('touchmove', function() { clearTimeout(pressTimer); }, { passive: true });

  function moveViaPrompt(card) {
    const cols = [...document.querySelectorAll('.kanban-col')].map(c => ({
      key: c.dataset.status,
      label: c.querySelector('.kanban-header span').textContent.trim(),
    }));
    const cur = card.dataset.status;
    const opts = cols.filter(c => c.key !== cur);
    const choice = window.prompt('Move #' + card.dataset.ticketId + ' to:\n' +
      opts.map((o, i) => (i + 1) + '. ' + o.label).join('\n'));
    const idx = parseInt(choice, 10) - 1;
    if (isNaN(idx) || idx < 0 || idx >= opts.length) return;
    moveCard(card, opts[idx].key);
  }
})();
</script>
