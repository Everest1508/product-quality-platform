{% extends "core/base.html" %}
{% block title %}New Rule — {{ product.name }}{% endblock %}
{% block content %}
<div class="head">
  <a href="{% url 'products:product_rules' pk=product.pk %}" class="btn" style="margin-right:12px;font-size:13px;">← Rules</a>
  <h1>New Automation Rule</h1>
</div>
<div class="card" style="max-width:640px;">
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="product" value="{{ product.pk }}">
    <div class="form-group">
      <label for="name">Rule Name</label>
      <input id="name" type="text" name="name" value="{{ form.name.value|default:'' }}" class="form-input" required>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label for="trigger_type">Trigger Type</label>
        <select id="trigger_type" name="trigger_type" class="form-input">
          <option value="error_threshold" {% if form.trigger_type.value == "error_threshold" %}selected{% endif %}>Error Threshold</option>
        </select>
      </div>
      <div class="form-group">
        <label for="severity">Severity Filter (optional)</label>
        <select id="severity" name="severity" class="form-input">
          <option value="">All severities</option>
          <option value="critical" {% if form.severity.value == "critical" %}selected{% endif %}>Critical</option>
          <option value="high" {% if form.severity.value == "high" %}selected{% endif %}>High</option>
          <option value="medium" {% if form.severity.value == "medium" %}selected{% endif %}>Medium</option>
          <option value="low" {% if form.severity.value == "low" %}selected{% endif %}>Low</option>
        </select>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label for="threshold_count">Threshold Count</label>
        <input id="threshold_count" type="number" name="threshold_count" value="{{ form.threshold_count.value|default:'5' }}" class="form-input" min="1" required>
      </div>
      <div class="form-group">
        <label for="window_minutes">Window (minutes)</label>
        <input id="window_minutes" type="number" name="window_minutes" value="{{ form.window_minutes.value|default:'60' }}" class="form-input" min="1" required>
      </div>
    </div>
    <div class="grid-2">
      <div class="form-group">
        <label for="action">Action</label>
        <select id="action" name="action" class="form-input">
          <option value="create_ticket" {% if form.action.value == "create_ticket" %}selected{% endif %}>Create Ticket</option>
          <option value="notify_only" {% if form.action.value == "notify_only" %}selected{% endif %}>Notify Only</option>
        </select>
      </div>
      <div class="form-group">
        <label for="assign_to">Assign To (optional)</label>
        <select id="assign_to" name="assign_to" class="form-input">
          <option value="">Nobody</option>
          {% for user in form.fields.assign_to.queryset %}
          <option value="{{ user.pk }}" {% if form.assign_to.value|stringformat:"d" == user.pk|stringformat:"d" %}selected{% endif %}>{{ user.get_full_name|default:user.username }}</option>
          {% endfor %}
        </select>
      </div>
    </div>
    <div class="form-group">
      <label style="display:flex;align-items:center;gap:8px;">
        <input type="checkbox" name="is_active" value="true" {% if form.is_active.value %}checked{% endif %}>
        <span>Active</span>
      </label>
    </div>
    <div style="display:flex;gap:8px;margin-top:20px;">
      <button type="submit" class="btn btn-primary">Create Rule</button>
      <a href="{% url 'products:product_rules' pk=product.pk %}" class="btn">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
